<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cada Día — Biblia en un año</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">Cada Día</div>
    <div class="header-actions">
      <div class="streak-pill" id="streakPill" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2c1.5 3 1 5-1 7-1.6 1.6-2 3-2 4.5a3 3 0 0 0 6 0c0-1 .4-1.8 1-2.5.9 1.2 1 2.4 1 3.5a5 5 0 0 1-10 0c0-4 2-6 3-7 1-1 1.5-2.5 2-5.5z"/></svg>
        <span><span class="num" id="streakNum">0</span> días seguidos</span>
      </div>
      <button class="icon-btn" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Onboarding -->
  <section class="onboard" id="onboard" hidden>
    <h1 class="eyebrow-free">Un año, una página a la vez</h1>
    <p class="lede">Un plan de lectura de toda la Biblia en 365 días, organizado por orden canónico. Elige cuándo empiezas y tu progreso se guarda en este dispositivo.</p>
    <div class="field-row">
      <div>
        <label for="startDateInput">Fecha de inicio</label>
        <input type="date" id="startDateInput">
      </div>
    </div>
    <button class="btn-primary" id="startBtn">Comenzar mi lectura</button>
  </section>

  <!-- Main app -->
  <main id="app" hidden>

    <section class="hero" id="heroSection">
      <!-- filled by JS -->
    </section>

    <div class="chain-wrap">
      <div class="chain-label">
        <span>Recorrido del año</span>
        <span class="frac" id="chainFrac">0 / 365</span>
      </div>
      <div class="chain" id="chain"></div>
    </div>

    <div class="section-head">
      <h2>Pendientes</h2>
      <span class="count" id="pendingCount"></span>
    </div>
    <div id="pendingList"></div>

    <div class="section-head">
      <h2>Plan completo</h2>
      <button class="plan-toggle open" id="planToggle">
        <span>Ocultar el plan</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div id="fullPlan"></div>

    <footer class="appfoot">
      <span id="progressSummary"></span>
      <button id="resetBtn">Reiniciar progreso</button>
    </footer>

  </main>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
